<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NeonSnake</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="main-box">

        <div class="top-section">

            <h1>
                NeonSnake
            </h1>

            <p class="game-info">
                A modern neon style snake game built by me
            </p>

        </div>

        <div class="score-area">

            <div class="score-card">

                <p class="score-label">
                    Current Score
                </p>

                <h2 class="score-number">
                    0
                </h2>

            </div>

        </div>

        <div class="game-area">

            <canvas
                id="gameCanvas"
                width="360"
                height="360"
            ></canvas>

        </div>

        <div class="button-area">

            <button class="start-btn">
                Start Game
            </button>

            <button class="restart-btn">
                Restart Game
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
